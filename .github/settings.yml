# Repository configuration, managed by the Settings app
# (https://github.com/repository-settings/app). The shared defaults come from
# regulad/.github; this file sets only what is this repository's own.
_extends: .github

repository:
  name: PartnerPortal
  description: >-
    Partner Portal is an open-source, self-hostable 1-on-1 video chat Android app designed for 24/7 use. It features automatic reconnection, Supabase signaling, and a Minecraft-themed UI.
  homepage: ""
  private: false
  # Topics: comma-and-space separated string, NOT a YAML list.
  topics: android, video-chat, webrtc, supabase, open-source, self-hosted, kotlin, minecraft-themed
  default_branch: master

  has_wiki: true

  allow_merge_commit: true
