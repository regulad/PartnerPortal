[versions]
accompanistPermissions = "0.28.0"
agp = "8.6.0-alpha07"
coil = "2.4.0"
kotlin = "2.0.20"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.2.1"
espressoCore = "3.6.1"
kotlinxSerializationJson = "1.7.2"
lifecycleRuntimeKtx = "2.8.4"
activityCompose = "1.8.0"
